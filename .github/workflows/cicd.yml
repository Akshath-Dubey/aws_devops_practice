name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: devops-lab-app

jobs:
  validate-iac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt / validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Ansible syntax check
        run: |
          pip install --quiet ansible-core
          printf '[servers]\nserver1 ansible_host=127.0.0.1\n' > /tmp/inventory.ini
          ansible-playbook -i /tmp/inventory.ini ansible/setup.yml --syntax-check

  build-deploy:
    needs: validate-iac
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${GITHUB_SHA::7} ./app
          docker images $IMAGE_NAME

      - name: Push image to GitHub Container Registry
        run: |
          REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest ${GITHUB_SHA::7}; do
            docker tag $IMAGE_NAME:latest $REPO:$tag
            docker push $REPO:$tag
          done

      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: devops-lab

      - name: Load image into cluster
        run: kind load docker-image $IMAGE_NAME:latest --name devops-lab

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl rollout status deployment/devops-app --timeout=120s
          kubectl get deployments,replicasets,pods,services -o wide

      - name: Smoke test the deployed app
        run: |
          kubectl port-forward service/devops-service 8080:80 >/dev/null 2>&1 &
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080 && break
            sleep 2
          done
          curl -sf http://localhost:8080 | grep "DevOps CI/CD Virtual Lab"

      - name: Scale test (2 -> 4 replicas)
        run: |
          kubectl scale deployment/devops-app --replicas=4
          kubectl rollout status deployment/devops-app --timeout=120s
          kubectl get pods -l app=devops -o wide
